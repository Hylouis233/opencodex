name: CI source provenance audit

on:
  push:
    branches: [audit/ci-source-provenance-20260913]
    paths: [.github/workflows/ci-source-provenance.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the original failing commit, not the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          fetch-depth: 1
          persist-credentials: false
      - name: Capture tracked source and independently verifiable identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opencodex-ci-source"
          mkdir -p "$evidence"
          git rev-parse HEAD HEAD^{tree} > "$evidence/verified-refs.txt"
          test "$(git rev-parse HEAD)" = 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          test "$(git rev-parse HEAD^{tree})" = 8cb8dbd8e0ef11ee040d6e366f83ad04b3229d13
          test -z "$(git status --porcelain)"
          git ls-tree -r HEAD > "$evidence/tree.txt"
          git ls-files > "$evidence/tracked-files.txt"
          git archive --format=tar.gz --output="$evidence/source.tar.gz" HEAD
          for item in package.json .bun-version .github/workflows/ci.yml .github/actions/setup-project-bun/action.yml; do
            name=$(printf '%s' "$item" | tr '/' '_')
            if git cat-file -e "HEAD:$item" 2>/dev/null; then
              git show "HEAD:$item" > "$evidence/$name"
              printf '%s %s\n' "$(git rev-parse "HEAD:$item")" "$item" >> "$evidence/relevant-blobs.txt"
            else
              printf 'MISSING %s\n' "$item" >> "$evidence/relevant-blobs.txt"
            fi
          done
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); console.log(JSON.stringify({name:p.name,version:p.version,packageManager:p.packageManager,bunDependency:p.dependencies?.bun,scripts:p.scripts},null,2))' > "$evidence/package-summary.json"
          (cd "$evidence" && sha256sum source.tar.gz > SHA256SUMS)
          test -z "$(git status --porcelain)"
          cat "$evidence/verified-refs.txt" "$evidence/relevant-blobs.txt" "$evidence/package-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source evidence without running repository code
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencodex-ci-source-0aeb199
          path: ${{ runner.temp }}/opencodex-ci-source/
          retention-days: 7
          if-no-files-found: error
