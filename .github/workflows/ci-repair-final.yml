name: CI repair final verification
on:
  push:
    branches: [audit/ci-source-provenance-20260913]
    paths: [.github/workflows/ci-repair-final.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.repository == 'Hylouis233/opencodex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, lane: linux-1, mode: '1/4' }
          - { os: ubuntu-latest, lane: linux-2, mode: '2/4' }
          - { os: ubuntu-latest, lane: linux-3, mode: '3/4' }
          - { os: ubuntu-latest, lane: linux-4, mode: '4/4' }
          - { os: ubuntu-latest, lane: linux-special, mode: special }
          - { os: ubuntu-latest, lane: linux-gates, mode: gates }
          - { os: windows-latest, lane: windows-regression, mode: focused }
          - { os: macos-latest, lane: macos-regression, mode: focused }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and verify the exact four-file candidate
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/provider-outbound-repair.patch > "$RUNNER_TEMP/provider-outbound.patch"
          git show HEAD:.github/maintenance/reset-credit-clock.patch > "$RUNNER_TEMP/reset-credit-clock.patch"
          git show HEAD:.github/maintenance/provider-outbound-controls.py > "$RUNNER_TEMP/provider-outbound-controls.py"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name, expected in {
            'provider-outbound.patch':'6e70794029feb410f43a933e93a79f1c24421da8d21fd27134662c6eef2aec16',
            'reset-credit-clock.patch':'6b060adf3dde6245da712287d464980665c4679bd8f8075184cf7fde7accbcb6',
          }.items():
            assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          PY
          git checkout --detach 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          test "$(git rev-parse HEAD^{tree})" = 8cb8dbd8e0ef11ee040d6e366f83ad04b3229d13
          git apply --index "$RUNNER_TEMP/provider-outbound.patch"
          git apply --index "$RUNNER_TEMP/reset-credit-clock.patch"
          test "$(git write-tree)" = c8f978ff1e9aeb6d9043a969ebfa86e37b3719d3
          git diff --exit-code
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          mkdir -p .tmp/provider-outbound-repair
          git rev-parse HEAD > .tmp/provider-outbound-repair/base-commit.txt
          git write-tree > .tmp/provider-outbound-repair/tested-tree.txt
          git diff --cached > .tmp/provider-outbound-repair/tested.patch
      - uses: ./.github/actions/setup-project-bun
      - name: Install the original locked dependencies and GUI assets
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Negative controls for the DNS, child cleanup, and injected-clock defects
        if: matrix.mode == 'gates' || matrix.mode == 'focused'
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/provider-outbound-controls.py"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source = Path('src/codex/reset-credit-auto-redeem.ts')
          candidate = source.read_bytes()
          try:
            source.write_bytes(subprocess.check_output(['git','show','HEAD:'+source.as_posix()]))
            result = subprocess.run(['bun','test','--isolate','--test-name-pattern','journal retention uses','tests/codex-integration/codex-reset-credit-auto-redeem.test.ts'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=30)
            log = result.stdout + result.stderr
            Path('.tmp/provider-outbound-repair/clock-negative.log').write_text(log,encoding='utf-8')
            assert result.returncode != 0 and 'journal retention uses the injected clock' in log and '1 fail' in log, log
          finally:
            source.write_bytes(candidate)
          PY
          git diff --exit-code
      - name: Full changed-file and adjacent regression tests on the native platform
        if: matrix.mode == 'gates' || matrix.mode == 'focused'
        run: |
          set -euo pipefail
          bun test --isolate tests/providers/provider-outbound.test.ts tests/routing/destination-policy-resolved.test.ts tests/providers/command-code-fakeip-discovery.test.ts tests/codex-integration/codex-reset-credit-auto-redeem.test.ts tests/cli/ocx-launcher-runtime.test.ts 2>&1 | tee .tmp/provider-outbound-repair/focused-tests.log
      - name: Run the unchanged official Linux shard helper
        if: matrix.mode != 'special' && matrix.mode != 'gates' && matrix.mode != 'focused'
        env:
          TEST_SHARD: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$TEST_SHARD" in 1/4|2/4|3/4|4/4) ;; *) exit 64;; esac
          bash scripts/ci/run-bun-test-batches.sh "$TEST_SHARD" 2>&1 | tee .tmp/provider-outbound-repair/linux-shard.log
      - name: Run every test excluded by the official Linux shard helper
        if: matrix.mode == 'special'
        run: |
          set -euo pipefail
          bun test --isolate ./tests/storage/api-storage-policy-already-running.test.ts ./tests/storage/api-storage-policy-mutation-busy.test.ts ./tests/storage/api-storage-policy-put-race.test.ts ./tests/storage/api-storage-policy-run.test.ts ./tests/storage/api-storage-policy.test.ts ./tests/storage/api-storage.test.ts 2>&1 | tee .tmp/provider-outbound-repair/storage-policy.log
          bun test --isolate ./tests/server/api-usage.test.ts 2>&1 | tee .tmp/provider-outbound-repair/api-usage.log
      - name: Run the original non-test gates without release or deployment
        if: matrix.mode == 'gates'
        run: |
          set -euo pipefail
          bun x tsc --noEmit 2>&1 | tee .tmp/provider-outbound-repair/typecheck.log
          bun x tsc --noEmit -p tests/tsconfig.doctor-service-memory-contract.json 2>&1 | tee .tmp/provider-outbound-repair/contract-typecheck.log
          (cd gui && bun test --isolate tests) 2>&1 | tee .tmp/provider-outbound-repair/gui-tests.log
          bun run privacy:scan 2>&1 | tee .tmp/provider-outbound-repair/privacy.log
          bun run skill:surface:check 2>&1 | tee .tmp/provider-outbound-repair/skill-surface.log
          bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check 2>&1 | tee .tmp/provider-outbound-repair/release-syntax.log
          bun run src/cli/index.ts help > .tmp/provider-outbound-repair/cli-help.log 2>&1
      - name: Verify the exact candidate survived all checks unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = c8f978ff1e9aeb6d9043a969ebfa86e37b3719d3
          git diff --cached --check
      - name: Preserve this lane's complete test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-repair-final-${{ matrix.lane }}
          path: .tmp/provider-outbound-repair/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the two independently scoped repairs only after all gates succeed
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/provider-outbound-repair.patch > "$RUNNER_TEMP/provider-outbound.patch"
          git show HEAD:.github/maintenance/reset-credit-clock.patch > "$RUNNER_TEMP/reset-credit-clock.patch"
          git checkout --detach 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          git config user.name 'Hong Liu'
          git config user.email '88263959+Hylouis233@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git apply --index "$RUNNER_TEMP/provider-outbound.patch"
          test "$(git write-tree)" = e12ab91056778f0f7cca0ffb4a5c2009fbc444e4
          git diff --exit-code
          git diff --cached --check
          git commit -m 'test: isolate provider proxy fixture DNS and reap timed-out children' -m 'Keep the real HTTP proxy/direct transports, redirect checks, destination policy and original assertions. Install a child-local deterministic DNS failure for the four fixture names. Preserve the 15-second outer test deadline and terminate/reap a stalled child within it. Controlled slow-DNS and hung-child comparisons passed on Linux, Windows and macOS.'
          git apply --index "$RUNNER_TEMP/reset-credit-clock.patch"
          test "$(git write-tree)" = c8f978ff1e9aeb6d9043a969ebfa86e37b3719d3
          git diff --exit-code
          git diff --cached --check
          git commit -m 'fix: prune reset-credit journals with the redeemer clock' -m 'Use the same injected time for journal writes and seven-day retention. Preserve the default production clock, pre-dispatch durability, unresolved entries, strict retention boundary and settled-credit idempotency. Add a regression with a historical clock and a boundary crossed during consume; the original implementation fails it. Complete official Linux batch/dedicated lanes and native changed-file regressions validated this exact four-file tree.'
          test "$(git rev-parse HEAD^{tree})" = c8f978ff1e9aeb6d9043a969ebfa86e37b3719d3
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          ref=refs/heads/fix/ci-stability-20260913
          current=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | cut -f1)
          test -z "$current"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$ref"
          unset auth PUSH_TOKEN
          git rev-parse HEAD HEAD^ HEAD^{tree} > final-commit.txt
          cat final-commit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-repair-final-commit
          path: final-commit.txt
          retention-days: 7
          if-no-files-found: error
