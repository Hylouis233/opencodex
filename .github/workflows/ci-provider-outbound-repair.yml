name: Provider outbound repair verification
on:
  push:
    branches: [audit/ci-source-provenance-20260913]
    paths: [.github/workflows/ci-provider-outbound-repair.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.repository == 'Hylouis233/opencodex'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the two-file patch to its immutable source baseline
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/provider-outbound-repair.patch > "$RUNNER_TEMP/provider-outbound.patch"
          echo '895d42a85f162a372969fe7fa124db5532cc50cbb20cc8307ac1506c2db2ad54  '"$RUNNER_TEMP/provider-outbound.patch" | shasum -a 256 --check
          git checkout --detach 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          test "$(git rev-parse HEAD^{tree})" = 8cb8dbd8e0ef11ee040d6e366f83ad04b3229d13
          git apply --index --check "$RUNNER_TEMP/provider-outbound.patch"
          git apply --index "$RUNNER_TEMP/provider-outbound.patch"
          test "$(git write-tree)" = 1e258489f7ec5e8b404c25b5ca79ca926bff6e6c
          git diff --exit-code
          git diff --cached --check
          mkdir -p .tmp/provider-outbound-repair
          git rev-parse HEAD > .tmp/provider-outbound-repair/base-commit.txt
          git write-tree > .tmp/provider-outbound-repair/tested-tree.txt
          git diff --cached > .tmp/provider-outbound-repair/tested.patch
      - uses: ./.github/actions/setup-project-bun
      - name: Install locked dependencies and build test assets
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Prove slow DNS isolation and child-timeout failure semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os, re, shutil, subprocess, tempfile, time
          root=Path('.tmp/provider-outbound-repair')
          fixture=Path('tests/fixtures/provider-outbound-e2e.ts')
          candidate=fixture.read_text()
          baseline=subprocess.check_output(['git','show','HEAD:'+fixture.as_posix()],text=True)
          baseline_path=fixture.with_name('provider-outbound-e2e.baseline-diagnostic.ts')
          baseline_path.write_text(baseline)
          preload=root/'slow-dns.ts'
          preload.write_text('''import { mock } from "bun:test";
          mock.module("node:dns/promises", () => ({ lookup: async (hostname: string) => {
            console.error("SLOW_SYSTEM_DNS " + hostname);
            await Bun.sleep(6_000);
            throw Object.assign(new Error("getaddrinfo ENOTFOUND " + hostname), {code:"ENOTFOUND"});
          }}));
          ''')
          def capture(name, command, timeout=20):
              home=tempfile.mkdtemp(prefix='ocx-proxy-control-')
              env=dict(os.environ,OPENCODEX_HOME=home)
              started=time.monotonic()
              process=subprocess.Popen(command,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding='utf-8',errors='replace')
              timed_out=False
              try:
                  try:
                      stdout,stderr=process.communicate(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      timed_out=True
                      process.kill()
                      stdout,stderr=process.communicate(timeout=5)
                  result={'returncode':process.returncode,'timed_out':timed_out,'seconds':time.monotonic()-started,'stdout':stdout,'stderr':stderr}
                  (root/(name+'.json')).write_text(json.dumps(result,indent=2),encoding='utf-8')
                  return result
              finally:
                  if process.poll() is None:
                      process.kill();process.wait(timeout=5)
                  shutil.rmtree(home,ignore_errors=True)
          try:
              old=capture('slow-dns-baseline',['bun','--preload','./'+preload.as_posix(),baseline_path.as_posix()],15)
              assert old['timed_out'], 'Baseline unexpectedly avoided the injected slow system resolver'
              assert 'SLOW_SYSTEM_DNS proxy-only.invalid' in old['stderr']
              new=capture('slow-dns-candidate',['bun','--preload','./'+preload.as_posix(),fixture.as_posix()],15)
              assert not new['timed_out'] and new['returncode']==0, new
              assert 'SLOW_SYSTEM_DNS' not in new['stderr'], 'Candidate reached the external resolver seam'
              value=json.loads(new['stdout'])
              assert value['dnsLookups']==['proxy-only.invalid','connection-proxy.invalid','proxy-models.invalid','all-proxy-only.invalid']
              assert len(value['proxyRequests'])==4 and len(value['providerRequests'])==3
              fixture.write_text(candidate+'\nconsole.error("DIAGNOSTIC_CHILD_PID " + process.pid);\nsetInterval(() => {}, 1_000);\n')
              hung=capture('hung-child-negative',['bun','test','--isolate','--test-name-pattern','proxy mode reaches one real proxy','tests/providers/provider-outbound.test.ts'],20)
              assert not hung['timed_out'] and hung['returncode']!=0, hung
              assert 'provider outbound fixture exited' in hung['stderr'], hung
              assert 'this test timed out' not in hung['stderr'], 'Outer deadline fired before fixture cleanup'
              match=re.search(r'DIAGNOSTIC_CHILD_PID (\d+)',hung['stderr'])
              assert match, 'Hung fixture did not reach the diagnostic hold'
              pid=match.group(1)
              probe=subprocess.run(['bun','-e',f'try {{ process.kill({pid}, 0); process.exit(1); }} catch (error) {{ if (error.code !== "ESRCH") throw error; }}'],capture_output=True,text=True)
              assert probe.returncode==0, 'Fixture process was not reaped: '+probe.stderr
              (root/'negative-controls-passed.txt').write_text('Slow system DNS: baseline times out; candidate avoids the system resolver.\nHung child: parent fails explicitly, before the outer deadline, and the child is gone.\n')
          finally:
              fixture.write_text(candidate)
              baseline_path.unlink(missing_ok=True)
          PY
          git diff --exit-code
      - name: Run the repaired test with all original assertions and adjacent policy tests
        run: |
          set -euo pipefail
          bun test --isolate tests/providers/provider-outbound.test.ts tests/routing/destination-policy-resolved.test.ts tests/providers/command-code-fakeip-discovery.test.ts 2>&1 | tee .tmp/provider-outbound-repair/focused-tests.log
      - name: Run type checking and privacy checks
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bun run typecheck 2>&1 | tee .tmp/provider-outbound-repair/typecheck.log
          bun run privacy:scan 2>&1 | tee .tmp/provider-outbound-repair/privacy.log
      - name: Run the complete repository test wrapper on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bun run test 2>&1 | tee .tmp/provider-outbound-repair/full-linux-tests.log
      - name: Run the original Windows 2-of-6 shard without assertion retries
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          bun test --isolate --timeout 60000 tests --shard=2/6 2>&1 | tee .tmp/provider-outbound-repair/windows-shard-2.log
          bun run src/cli/index.ts help > .tmp/provider-outbound-repair/windows-cli-help.log 2>&1
      - name: Verify the tested source has not changed
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 1e258489f7ec5e8b404c25b5ca79ca926bff6e6c
          git diff --cached --check
      - name: Preserve the exact-tree test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-outbound-repair-${{ matrix.os }}
          path: .tmp/provider-outbound-repair/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only the validated two-file repair on a new branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/provider-outbound-repair.patch > "$RUNNER_TEMP/provider-outbound.patch"
          git checkout --detach 0aeb1992cd257c8854581066418e3ff54fbbb5d3
          git apply --index "$RUNNER_TEMP/provider-outbound.patch"
          test "$(git write-tree)" = 1e258489f7ec5e8b404c25b5ca79ca926bff6e6c
          git diff --exit-code
          git diff --cached --check
          git config user.name 'Hong Liu'
          git config user.email '88263959+Hylouis233@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git commit -m 'test: isolate provider proxy fixture DNS and reap timed-out children' -m 'Make the four intentionally unresolvable provider names deterministic inside the fixture child, preserving real HTTP proxy/direct transports, destination-policy logic, redirect redaction, and every existing assertion. Keep the 15-second outer deadline and fail/reap the child within it. Verified with slow-DNS and hung-child negative controls plus native regression suites; no production code or workflow enters this repair commit.'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          ref=refs/heads/fix/provider-outbound-ci-20260913
          current=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | cut -f1)
          test -z "$current"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$ref"
          unset auth PUSH_TOKEN
          git rev-parse HEAD HEAD^{tree} > final-commit.txt
          cat final-commit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-outbound-final-commit
          path: final-commit.txt
          retention-days: 7
          if-no-files-found: error
