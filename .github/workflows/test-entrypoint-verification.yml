name: Test entrypoint verification
on:
  push:
    branches: [audit/test-entrypoint-20260914]
    paths: [.github/workflows/test-entrypoint-verification.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.repository == 'Hylouis233/opencodex' && github.actor == 'Hylouis233'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage only the two-file candidate on the repaired source
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/test-entrypoint.patch > "$RUNNER_TEMP/entrypoint.patch"
          python -c 'import hashlib,os,pathlib; assert hashlib.sha256((pathlib.Path(os.environ["RUNNER_TEMP"])/"entrypoint.patch").read_bytes()).hexdigest()=="b7a403b0ed559a0cc7e62a2507e0dbd987b6445a3529a2cb0769cbb1061609c8"'
          git checkout --detach d978bae5036d513f5d108929c13c6d0910d65a41
          test "$(git rev-parse HEAD^{tree})" = c8f978ff1e9aeb6d9043a969ebfa86e37b3719d3
          git apply --index "$RUNNER_TEMP/entrypoint.patch"
          test "$(git write-tree)" = ee49bdf364e4dd155bf03ad11f84a29c97d0e232
          git diff --exit-code
          git diff --cached --check
          mkdir -p .tmp/entrypoint-evidence
          git rev-parse HEAD > .tmp/entrypoint-evidence/base.txt
          git write-tree > .tmp/entrypoint-evidence/tested-tree.txt
          git diff --cached > .tmp/entrypoint-evidence/tested.patch
      - uses: ./.github/actions/setup-project-bun
      - name: Install locked dependencies and test assets
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Confirm the scheduling regression detects the old plan
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scripts/test.ts'); candidate=p.read_bytes()
          try:
            p.write_bytes(subprocess.check_output(['git','show','HEAD:scripts/test.ts']))
            result=subprocess.run(['bun','test','--isolate','--test-name-pattern','npm launcher runtime is executed once','tests/ci-workflows/test-runner.test.ts'],capture_output=True,text=True,timeout=30)
            log=result.stdout+result.stderr
            Path('.tmp/entrypoint-evidence/old-plan-negative.log').write_text(log)
            assert result.returncode==1 and '1 fail' in log and 'Received length: 0' in log, log
          finally:
            p.write_bytes(candidate)
          PY
          git diff --exit-code
      - name: Run all changed and adjacent test files on the native platform
        run: |
          set -euo pipefail
          bun test --isolate --timeout 60000 tests/ci-workflows/test-runner.test.ts tests/ci-workflows/macos-serial-lanes.test.ts tests/ci-workflows/ci-workflows.test.ts tests/cli/ocx-launcher-runtime.test.ts 2>&1 | tee .tmp/entrypoint-evidence/focused.log
      - name: Verify the standalone launcher lane using the unchanged wrapper
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          bun run test --parallel=1 ./tests/cli/ocx-launcher-runtime.test.ts 2>&1 | tee .tmp/entrypoint-evidence/launcher-lane.log
      - name: Run the complete real prepush entrypoint on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Scope the existing conditional UI checks to the actual two-file patch,
          # rather than this fork's stale integration branch. Neither is a UI file.
          export LINT_FILES="$(git diff --cached --name-only)"
          export DOCTOR_FILES="$LINT_FILES"
          bun run prepush 2>&1 | tee .tmp/entrypoint-evidence/full-prepush.log
      - name: Verify tested source identity
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = ee49bdf364e4dd155bf03ad11f84a29c97d0e232
          git diff --cached --check
      - name: Preserve complete logs and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-entrypoint-${{ matrix.os }}
          path: .tmp/entrypoint-evidence/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only the validated source, with no workflow in the repair commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/test-entrypoint.patch > "$RUNNER_TEMP/entrypoint.patch"
          git checkout --detach d978bae5036d513f5d108929c13c6d0910d65a41
          git apply --index "$RUNNER_TEMP/entrypoint.patch"
          test "$(git write-tree)" = ee49bdf364e4dd155bf03ad11f84a29c97d0e232
          git diff --exit-code
          git diff --cached --check
          git config user.name 'Hong Liu'
          git config user.email '88263959+Hylouis233@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git commit -m 'test: isolate the npm launcher runtime in the full-suite plan' -m 'Keep every launcher assertion and its original per-case deadline. Run this known full-pool stall case once in the existing standalone lane mechanism, with a file budget covering all four case budgets and cleanup. Add a regression preventing omission or duplicate scheduling. Complete Linux prepush and native Windows/macOS runner and launcher checks validated this exact two-file change without assertion retries.'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          ref=refs/heads/fix/test-entrypoint-20260914
          current=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | cut -f1)
          test -z "$current"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$ref"
          unset auth PUSH_TOKEN
          git rev-parse HEAD HEAD^{tree} > final-commit.txt
          cat final-commit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-entrypoint-final-commit
          path: final-commit.txt
          retention-days: 7
          if-no-files-found: error
